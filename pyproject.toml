[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropsprices"
version = "0.1.0"
description = "Crops price data tools"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bulk-get-resources = "cropsprices.scripts.bulk_get_resources:main"
get-resources = "cropsprices.scripts.get_resources:main"
bulk-process-resources = "cropsprices.scripts.bulk_process_resources:main"
process-resources = "cropsprices.scripts.process_resources:main"
build-arrow-db = "cropsprices.scripts.build_arrow_db:main"
update-arrow-db = "cropsprices.scripts.update_arrow_db:main"
generate-availability = "cropsprices.scripts.generate_availability:main"
update-availability = "cropsprices.scripts.update_availability:main"
roll-year = "cropsprices.scripts.roll_year:main"

[tool.setuptools.packages.find]
include = ["cropsprices*"]
