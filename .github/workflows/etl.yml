name: ETL
on:
  schedule:
    - cron: '17 */12 * * *'  # Every 12 hours (00:17, 12:17 UTC)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Check for new data and update
        run: python -m cropsprices.ci_pipeline

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ data/.last-bulletin-id
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "data: update $(date -u +%Y-%m-%d)" && \
            git push
